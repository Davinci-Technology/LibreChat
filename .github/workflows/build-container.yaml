name: Sync, Build and Deploy

on:
  # Run daily at 3am
  schedule:
    - cron: '0 10 * * *'

  # Allow manual triggering with input options
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Only sync with upstream (no build/deploy)'
        required: false
        default: 'false'
        type: boolean

  # Also run on push to main (for direct commits)
  push:
    branches: ["main"]

jobs:
  sync:
    runs-on: [self-hosted, Linux]
    # Skip this job for push events (only run on schedule or manual trigger)
    if: github.event_name != 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Setup Upstream Remote
        run: |
          if git remote | grep -q "^upstream$"; then
            echo "Upstream remote already exists, updating URL"
            git remote set-url upstream https://github.com/danny-avila/LibreChat.git
          else
            echo "Adding upstream remote"
            git remote add upstream https://github.com/danny-avila/LibreChat.git
          fi
          git fetch upstream

      - name: Merge Upstream Changes
        run: |
          git checkout main

          # Attempt merge, allow failure for conflict resolution
          if git merge upstream/main --no-edit; then
            echo "Merge completed cleanly."
          else
            echo "Merge conflicts detected, resolving known patterns..."

            # 1. Workflows: delete all upstream workflows, keep ours
            find .github/workflows -name "*.yml" -not -name "build-container.yaml" -delete 2>/dev/null || true
            find .github/workflows -name "*.yaml" -not -name "build-container.yaml" -delete 2>/dev/null || true
            git checkout --ours -- .github/workflows/build-container.yaml 2>/dev/null || true
            git add .github/workflows/

            # 2. Our custom files: keep ours
            for f in \
              Dockerfile \
              packages/api/src/mcp/connection.ts \
              packages/api/package.json \
              api/app/clients/tools/util/handleTools.js \
              api/app/clients/tools/index.js; do
              if git diff --name-only --diff-filter=U | grep -q "^${f}$"; then
                echo "Resolving $f -> keeping ours"
                git checkout --ours -- "$f"
                git add "$f"
              fi
            done

            # 3. CLAUDE.md / AGENTS.md: handle "distinct types" conflict
            # Git renames to CLAUDE.md~HEAD and CLAUDE.md~upstream/main for type conflicts.
            # These renamed files are tracked in the index as conflicted entries.
            if ls CLAUDE.md~* 1>/dev/null 2>&1 || git status --porcelain | grep -q "CLAUDE.md"; then
              echo "Resolving CLAUDE.md distinct types conflict -> keeping ours"
              # Keep our version: the ~HEAD variant is ours
              if [ -f "CLAUDE.md~HEAD" ]; then
                cp "CLAUDE.md~HEAD" CLAUDE.md
              fi
              # Remove the renamed conflict variants from disk and index
              for variant in CLAUDE.md~HEAD "CLAUDE.md~upstream/main"; do
                if [ -f "$variant" ]; then
                  rm -f "$variant"
                fi
                # Force-update the index to remove the entry (even if file is already gone)
                git update-index --force-remove "$variant" 2>/dev/null || true
              done
              # Stage our CLAUDE.md
              git add CLAUDE.md
              # Remove upstream's AGENTS.md symlink if present
              git rm -f AGENTS.md 2>/dev/null || true
              rm -f AGENTS.md 2>/dev/null || true
            fi

            # 4. package.json / package-lock.json: accept upstream versions
            for f in package.json package-lock.json; do
              if git diff --name-only --diff-filter=U | grep -q "^${f}$"; then
                echo "Resolving $f -> accepting upstream"
                git checkout --theirs -- "$f"
                git add "$f"
              fi
            done

            # 5. Check for any remaining unresolved conflicts
            REMAINING=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
            if [ -n "$REMAINING" ]; then
              echo "::error::Unresolved merge conflicts in:"
              echo "$REMAINING"
              echo "Manual intervention required."
              exit 1
            fi

            git commit --no-edit
          fi

          # Post-merge: regenerate package-lock.json to sync with our custom package.json changes
          # (upstream's lockfile won't include our added dependencies like ws, @types/ws)
          npm install --package-lock-only --ignore-scripts 2>/dev/null && git add package-lock.json
          if ! git diff --cached --quiet -- package-lock.json; then
            git commit -m "Regenerate package-lock.json for custom dependencies"
          fi

          # Post-merge: remove any upstream workflows that came in cleanly
          REMOVED_WORKFLOWS=false
          for wf in .github/workflows/*.yml .github/workflows/*.yaml; do
            if [ -f "$wf" ] && [ "$(basename "$wf")" != "build-container.yaml" ]; then
              rm "$wf"
              git add "$wf"
              REMOVED_WORKFLOWS=true
            fi
          done
          if [ "$REMOVED_WORKFLOWS" = true ]; then
            git commit -m "Remove upstream workflows" || true
          fi

      - name: Push Changes
        run: |
          git push origin main

  build:
    runs-on: [self-hosted, Linux]
    # Run after sync for schedule/manual events (unless sync_only=true), or directly for push events
    needs: [sync]
    if: always() && (needs.sync.result == 'success' || github.event_name == 'push') && (github.event.inputs.sync_only != 'true')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          # Ensure we get the latest code including any changes from the sync job
          ref: main

      - name: Log in to Docker Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login --username "${{ vars.REGISTRY_USERNAME }}" --password-stdin ${{ vars.REGISTRY_HOSTNAME }}

      - name: Dockerize
        run: |
          docker build -t librechat:davinci .
          docker tag librechat:davinci ${{ vars.REGISTRY_HOSTNAME }}/librechat:davinci
          docker push ${{ vars.REGISTRY_HOSTNAME }}/librechat:davinci

      - name: Deploy
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          # Create temporary kubeconfig file
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_CONTENT" > $HOME/.kube/config-temp
          chmod 600 $HOME/.kube/config-temp

          # Set KUBECONFIG and deploy
          export KUBECONFIG=$HOME/.kube/config-temp
          kubectl -n librechat rollout restart deployment/librechat-prd-librechat

          # Clean up
          rm -f $HOME/.kube/config-temp
